[package]
name = "plant-companion"
version = "0.7.0"
edition = "2021"

[lib]
name = "plant_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plant-life-core = { path = "../crates/life-core" }
plant-store = { path = "../crates/plant-store" }
