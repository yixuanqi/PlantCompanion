<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小蘑菇 v0.5 · 新旧原画并排验收</title><style>
:root{font-family:'Microsoft YaHei UI',system-ui,sans-serif;color:#5a675c;background:#edf3e9}*{box-sizing:border-box}body{margin:0;padding:22px}.wrap{max-width:970px;margin:auto}h1{font-size:22px;margin:0 0 9px}p{font-size:13px;line-height:1.75;margin:0 0 16px;color:#748579}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button{background:#fffdf4;border:1px solid #ccdbc8;padding:9px 13px;border-radius:12px;color:#496b50;cursor:pointer}button.on{background:#d9e9d3;border-color:#8fb08c;font-weight:600}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:14px;border-radius:18px;background:#fffef9;border:1px solid #d4e2d0}.card h2{font-size:16px;margin:0 0 10px}.scene{height:285px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:linear-gradient(135deg,#f9f8ed,#d7e8cf);overflow:hidden}.scene.dark{background:linear-gradient(130deg,#1d2629,#3d555b)}.sprite{height:210px;width:210px;position:relative;pointer-events:none}.sprite>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.sprite .stalk{z-index:2;transform-origin:50% 64%}.sprite .cap{z-index:3;transform-origin:50% 48%}.sprite .foliage{z-index:4;transform-origin:50% 64%}.sprite .pot{z-index:1}.animate .stalk{animation:stem 5s ease-in-out infinite}.animate .cap{animation:cap 5s ease-in-out infinite}.animate .foliage{animation:leaf 5.3s ease-in-out infinite}@keyframes stem{0%,100%{transform:rotate(-.2deg)}50%{transform:rotate(.25deg)}}@keyframes cap{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-.6px) rotate(.6deg)}}@keyframes leaf{0%,100%{transform:rotate(-.1deg)}50%{transform:rotate(.1deg)}}.notice{margin-top:18px;background:#fffdf4;border:1px solid #e0e5d7;padding:12px 16px;border-radius:14px;font-size:13px;line-height:1.8;color:#667561}@media(max-width:620px){.cards{grid-template-columns:1fr}.scene{height:230px}}
</style></head><body><div class="wrap"><h1>🍄 小蘑菇 · 新旧资源对照</h1><p>只比较渲染外观，不改动 Rust 游戏存档。新版仅有健康 / 睡眠两种姿态，其他生命阶段仍由旧资源提供。新版是结构试制素材，尚未达到最初水彩精修目标。</p><div class="toolbar"><button class="on" id="healthy">健康态</button><button id="sleep">睡眠态</button><button id="light" class="on">浅色背景</button><button id="dark">深色背景</button><button id="anim" class="on">暂停局部动画</button></div><div class="cards"><section class="card"><h2>旧版 · 256px 概念图切片</h2><div class="scene"><div class="sprite" id="old"><img id="old-image" alt="旧版小蘑菇" src="./plant-assets/mushroom/states/healthy.png"></div></div></section><section class="card"><h2>新版 · 694×736 分层母版</h2><div class="scene"><div class="sprite animate" id="new"><img class="pot" id="pot" alt=""><img class="stalk" id="stalk" alt=""><img class="cap" id="cap" alt=""><img class="foliage" id="foliage" alt=""></div></div></section></div><div class="notice">正式集成入口：种植小蘑菇后，打开挂件右下角「⋯」菜单，选择「预览新版小蘑菇」。再次点击可以回退旧版；缺水和枯死状态自动回退旧素材，不影响倒计时或存档。</div></div><script>
let stage='healthy',dark=false,playing=true;const $=id=>document.getElementById(id);function refresh(){$('old-image').src='./plant-assets/mushroom/states/'+stage+'.png';for(const part of ['pot','stalk','cap','foliage'])$(part).src='./plant-assets/mushroom_v2/'+stage+'/'+part+'.png';document.querySelectorAll('.scene').forEach(el=>el.classList.toggle('dark',dark));$('new').classList.toggle('animate',playing);for(const type of ['healthy','sleep'])$(type).classList.toggle('on',type===stage);$('light').classList.toggle('on',!dark);$('dark').classList.toggle('on',dark);$('anim').textContent=playing?'暂停局部动画':'播放局部动画';$('anim').classList.toggle('on',playing)}for(const st of ['healthy','sleep'])$(st).onclick=()=>{stage=st;refresh()};$('light').onclick=()=>{dark=false;refresh()};$('dark').onclick=()=>{dark=true;refresh()};$('anim').onclick=()=>{playing=!playing;refresh()};refresh();</script></body></html>
