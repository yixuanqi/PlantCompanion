name: Windows desktop verification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Rebuild offline browser preview
        run: node scripts/build_preview.mjs
      - name: Node regression tests
        run: npm run test:static
      - name: Rust lifecycle and SQLite transactions
        run: cargo test -p plant-life-core -p plant-store -- --nocapture
      - name: TypeScript + Vite
        run: npm run build
      - name: Windows desktop bundle
        run: npm run tauri build
      - name: Upload Windows installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PlantCompanion-Windows-Installer
          path: |
            target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
