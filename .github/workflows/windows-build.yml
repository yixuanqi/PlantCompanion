name: Windows build packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Rebuild offline browser preview
        run: node scripts/build_preview.mjs
      - name: Node regression tests
        run: npm run test:static
      - name: Rust lifecycle and SQLite transactions
        run: cargo test -p plant-life-core -p plant-store -- --nocapture
      - name: TypeScript + Vite
        run: npm run build
      - name: Windows desktop bundle
        run: npm run tauri build
      - name: Package portable build
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = @("target/release/桌面小植物.exe", "target/release/plant-companion.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "release exe not found under target/release" }
          New-Item -ItemType Directory -Force "portable/PlantCompanion" | Out-Null
          Copy-Item $exe "portable/PlantCompanion/PlantCompanion.exe"
          Compress-Archive -Path "portable/PlantCompanion" -DestinationPath "portable/PlantCompanion-$version-win64-portable.zip"
      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PlantCompanion-Windows-Installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload portable zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PlantCompanion-Windows-Portable
          path: portable/*.zip
          if-no-files-found: error
      - name: Attach packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            portable/*.zip
